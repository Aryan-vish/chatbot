<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - AI Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            padding-top: 100px;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        #error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <p id="error"></p>

</div>

<script>
async function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const error = document.getElementById("error");

    error.innerText = "";

    const formData = new URLSearchParams();

    formData.append("username", email);
    formData.append("password", password);
    formData.append("grant_type", "password");

    try {

        const response = await fetch("/login", {
            method: "POST",

            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },

            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            error.innerText = data.detail || "Login failed";
            return;
        }

        // Save JWT token
        localStorage.setItem(
            "access_token",
            data.access_token
        );

        // Open chatbot
        window.location.href = "/chat-ui";

    } catch (err) {

        error.innerText = "Could not connect to server";
        console.error(err);
    }
}
</script>

</body>
</html>
